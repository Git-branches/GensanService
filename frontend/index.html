<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102f54" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Independent guide to government service requirements, document checklists, and offices in General Santos City." />
    <meta property="og:site_name" content="Andam GenSan" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Andam GenSan" />
    <meta property="og:description" content="Know the requirements before you go. An independent guide to government services in General Santos City." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Andam GenSan</title>
    <style>
      html.other-language #root { visibility: hidden; }
      html.other-page main { min-height: 100svh; }
      html.other-page main > * { display: none; }
    </style>
    <script>
      // A pre-built page is one English route. Before the first paint, hide what this visitor should not see.
      // Keep this in step with initialLocale() in src/i18n/I18nProvider.jsx.
      (function () {
        var html = document.documentElement

        // Saved text size and contrast. Keep in step with src/utils/display.js.
        try {
          var display = JSON.parse(localStorage.getItem('andam-gensan-display')) || {}
          if (display.size === 'large') html.classList.add('text-large')
          if (display.size === 'larger') html.classList.add('text-larger')
          if (display.contrast === true) html.classList.add('high-contrast')
        } catch (error) {}

        var route = html.dataset.route
        if (!route) return

        var locale = new URLSearchParams(location.search).get('lang')
        if (!locale) {
          try {
            locale = localStorage.getItem('andam-gensan-language')
          } catch (error) {
            locale = null
          }
        }
        if (!locale) {
          var browser = (navigator.languages || [navigator.language]).map(function (tag) {
            return tag && tag.split('-')[0]
          })
          locale = ['en', 'ceb', 'fil', 'hil'].filter(function (code) {
            return browser.indexOf(code) !== -1
          })[0]
        }

        var path = location.pathname.replace(/\/+$/, '') || '/'
        if ((locale && locale !== 'en') || path.indexOf('/admin') === 0) html.classList.add('other-language')

        // A search or filter in the address changes the page, so the pre-built copy would not match.
        var params = new URLSearchParams(location.search)
        params.delete('lang')
        if (path !== route || params.toString()) html.classList.add('other-page')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
